name: Build & Publish Docker Image

on:
  release:
    types: [published]

concurrency:
  group: docker-build-${{ github.ref }}
  # Let a running build finish so it can save its cache; newer runs wait in line.
  cancel-in-progress: false

jobs:
  push-to-dockerhub:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Docker Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            tuftsttsrt/rserver
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push AMD64 Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: true

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          # Layer cache lives in Docker Hub, so it survives between runs.
          # The first run after this change seeds it; later runs reuse unchanged layers.
          cache-from: type=registry,ref=tuftsttsrt/rserver:buildcache
          cache-to: type=registry,ref=tuftsttsrt/rserver:buildcache,mode=max,ignore-error=true

          secrets: |
            GPAT=${{ secrets.GPAT }}

          provenance: false
          sbom: false
